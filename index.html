<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Attendance | Neumorphic Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e2e8f0;
            --surface: #e2e8f0;
            --shadow-light: #ffffff;
            --shadow-dark: #b8c2cc;
            --cyan-primary: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.4);
            --cyan-light: #e0f2fe;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: var(--text-primary);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 
                16px 16px 32px var(--shadow-dark),
                -16px -16px 32px var(--shadow-light);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-card {
            background: var(--surface);
            padding: 18px 20px;
            border-radius: 20px;
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark),
                inset -4px -4px 8px var(--shadow-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-info h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .brand-info p {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .date-pill {
            background: var(--cyan-light);
            color: var(--cyan-primary);
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 
                3px 3px 6px var(--shadow-dark),
                -3px -3px 6px var(--shadow-light);
        }

        .live-status-bar {
            background: var(--surface);
            padding: 14px;
            border-radius: 16px;
            box-shadow: 
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-badge.active .pulse-dot {
            background: var(--cyan-primary);
            box-shadow: 0 0 10px var(--cyan-glow);
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        .live-stream-text {
            font-size: 16px;
            font-weight: 700;
            color: var(--cyan-primary);
            letter-spacing: 2px;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }

        .textarea-recessed {
            background: var(--surface);
            border-radius: 20px;
            padding: 14px;
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark),
                inset -6px -6px 12px var(--shadow-light);
        }

        textarea {
            width: 100%;
            height: 200px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 17px;
            font-weight: 600;
            line-height: 1.7;
            letter-spacing: 1.5px;
            resize: none;
        }

        textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
            font-weight: 400;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn {
            border: none;
            outline: none;
            background: var(--surface);
            padding: 14px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            box-shadow: 
                6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
        }

        .btn:active {
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark),
                inset -4px -4px 8px var(--shadow-light);
            transform: translateY(1px);
        }

        .btn-start {
            color: var(--cyan-primary);
        }

        .btn-stop {
            color: var(--danger);
        }

        .btn-full {
            grid-column: span 2;
        }

        .instructions-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 
                inset 3px 3px 6px var(--shadow-dark),
                inset -3px -3px 6px var(--shadow-light);
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .instructions-card strong {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <div class="brand-info">
            <h1>Pulse ID</h1>
            <p>Real-Time Voice Stream</p>
        </div>
        <div class="date-pill" id="datePill">--/--</div>
    </div>

    <div class="live-status-bar">
        <div class="status-badge" id="statusBadge">
            <div class="pulse-dot"></div>
            <span id="statusText">Mic Off</span>
        </div>
        <div class="live-stream-text" id="liveStream">...</div>
    </div>

    <div class="textarea-recessed">
        <textarea id="attendanceBox" placeholder="Start speaking digits..."></textarea>
    </div>

    <div class="controls-grid">
        <button class="btn btn-start" onclick="startRecognition()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            Start Mic
        </button>
        <button class="btn btn-stop" onclick="stopRecognition()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            Stop Mic
        </button>
        <button class="btn" onclick="downloadCSV()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export CSV
        </button>
        <button class="btn" style="color: var(--success);" onclick="shareWhatsApp()">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
            WhatsApp
        </button>
        <button class="btn btn-full" style="color: var(--text-secondary);" onclick="clearData()">Clear All Data</button>
    </div>

    <div class="instructions-card">
        ⚡ <strong>Low Latency Stream:</strong> Captures audio chunks instantly with continuous buffer tracking.<br>
        💾 <strong>Auto-Saved:</strong> Stores data locally in real time.
    </div>
</div>

<script>
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const liveStream = document.getElementById('liveStream');
    const attendanceBox = document.getElementById('attendanceBox');
    const datePill = document.getElementById('datePill');
    
    let recognition;
    let isListening = false;
    let processedResultIndex = 0;

    function getTodayDateString() {
        const today = new Date();
        const dd = String(today.getDate()).padStart(2, '0');
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const yyyy = today.getFullYear();
        return { short: `${dd}/${mm}`, full: `${dd}-${mm}-${yyyy}` };
    }

    const dateInfo = getTodayDateString();
    datePill.textContent = dateInfo.short;

    window.onload = () => {
        const savedData = localStorage.getItem('attendance_data');
        if (savedData) {
            attendanceBox.value = savedData;
        }
    };

    function saveData() {
        localStorage.setItem('attendance_data', attendanceBox.value);
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            isListening = true;
            statusText.textContent = "Listening...";
            statusBadge.classList.add('active');
        };

        recognition.onresult = (event) => {
            let interimText = '';

            // Fast-path processing for finalized frames
            for (let i = processedResultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    appendDigitChunk(event.results[i][0].transcript);
                    processedResultIndex = i + 1;
                } else {
                    interimText += event.results[i][0].transcript;
                }
            }

            const cleanInterim = interimText.replace(/\D/g, '');
            liveStream.textContent = cleanInterim || '...';
        };

        recognition.onerror = (event) => {
            console.error('Speech Recognition Error:', event.error);
        };

        recognition.onend = () => {
            if (isListening) {
                // Instantly re-arm recognition context
                recognition.start();
            } else {
                statusText.textContent = "Mic Off";
                statusBadge.classList.remove('active');
                liveStream.textContent = '...';
            }
        };
    } else {
        alert("Speech Recognition API is not supported by this browser. Please use Chrome.");
    }

    function startRecognition() {
        if (recognition && !isListening) {
            isListening = true;
            processedResultIndex = 0;
            recognition.start();
        }
    }

    function stopRecognition() {
        if (recognition && isListening) {
            isListening = false;
            recognition.stop();
        }
    }

    // Direct insertion pipeline ensuring zero string re-parsing lag
    function appendDigitChunk(speechText) {
        const newDigits = speechText.replace(/\D/g, '');
        if (!newDigits) return;

        let currentValue = attendanceBox.value;
        
        for (let char of newDigits) {
            // Retrieve length of the active line segment
            const lines = currentValue.split('\n');
            const currentLine = lines[lines.length - 1];

            if (currentLine.length >= 8) {
                currentValue += '\n' + char;
            } else {
                currentValue += char;
            }
        }

        attendanceBox.value = currentValue;
        saveData();
        attendanceBox.scrollTop = attendanceBox.scrollHeight;
    }

    attendanceBox.addEventListener('input', () => {
        saveData();
    });

    function downloadCSV() {
        const content = attendanceBox.value.trim();
        if (!content) {
            alert("No records to export.");
            return;
        }

        const rows = content.split('\n').filter(r => r.trim() !== '');
        let csvContent = "data:text/csv;charset=utf-8,S.No,Attendance_ID\n";

        rows.forEach((id, index) => {
            csvContent += `${index + 1},${id}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Attendance_${dateInfo.full}.csv`);
        document.body.appendChild(link);

        link.click();
        document.body.removeChild(link);
    }

    function shareWhatsApp() {
        const content = attendanceBox.value.trim();
        if (!content) {
            alert("Attendance box is empty.");
            return;
        }

        const message = `*Attendance Record (${dateInfo.full})*\n\n` + content;
        window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
    }

    function clearData() {
        if (confirm("Clear all recorded entries?")) {
            attendanceBox.value = '';
            localStorage.removeItem('attendance_data');
            liveStream.textContent = '...';
            processedResultIndex = 0;
        }
    }
</script>

</body>
</html>
