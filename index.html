<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Offline voice-first attendance capture for classrooms.">
  <link rel="manifest" href="manifest.json">
  <title>Sabaq Voice Attendance</title>
  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1746b3;
      --ink: #14213d;
      --muted: #667085;
      --surface: #f4f7fb;
      --white: #ffffff;
      --line: #e4e9f2;
      --green: #109567;
      --red: #dc3f57;
      --shadow: 10px 10px 24px rgba(39, 61, 94, .12), -8px -8px 20px rgba(255,255,255,.9);
      --inset: inset 4px 4px 10px rgba(37, 61, 98, .10), inset -4px -4px 10px rgba(255,255,255,.9);
      font-family: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: radial-gradient(circle at 90% 0%, #e5efff 0, transparent 30%), var(--surface); }
    button, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app-shell { width: min(100%, 760px); margin: 0 auto; padding: 22px 18px calc(34px + env(safe-area-inset-bottom)); }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 28px; }
    .brand-mark { display: inline-flex; align-items: center; gap: 8px; color: var(--blue); font-weight: 800; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 5px #dce8ff; }
    h1 { margin: 8px 0 0; font-size: clamp(30px, 8vw, 48px); letter-spacing: -.05em; line-height: .96; max-width: 420px; }
    .install-btn { display: none; background: var(--ink); color: #fff; padding: 12px 14px; border-radius: 13px; font-weight: 700; box-shadow: 0 8px 18px rgba(20,33,61,.15); }
    .install-btn.visible { display: block; }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .status-pill { display: inline-flex; align-items: center; gap: 9px; padding: 10px 14px; border-radius: 999px; background: var(--white); box-shadow: var(--shadow); color: var(--muted); font-size: 13px; font-weight: 700; }
    .status-light { width: 9px; height: 9px; border-radius: 50%; background: #98a2b3; }
    .status-pill.recording { color: var(--red); } .status-pill.recording .status-light { background: var(--red); animation: blink 1.2s infinite; }
    .status-pill.processing { color: var(--blue); } .status-pill.processing .status-light { background: var(--blue); animation: blink .8s infinite; }
    .date-label { color: var(--muted); font-size: 12px; font-weight: 700; text-align: right; }
    .hero-panel { background: var(--white); border: 1px solid rgba(255,255,255,.8); border-radius: 28px; padding: 24px 18px 18px; box-shadow: var(--shadow); }
    .mic-wrap { display: grid; place-items: center; margin: 3px 0 22px; }
    .mic-button { position: relative; width: 148px; height: 148px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: linear-gradient(145deg, #3378ff, #1e54cb); box-shadow: 12px 13px 24px rgba(37,99,235,.28), -8px -8px 18px #fff; transition: transform .2s ease, box-shadow .2s ease; }
    .mic-button:active { transform: scale(.96); }
    .mic-button.recording { box-shadow: 0 0 0 13px rgba(220,63,87,.12), 0 0 0 27px rgba(220,63,87,.06), 12px 13px 24px rgba(220,63,87,.28); background: linear-gradient(145deg, #ef5d70, #c62e4a); animation: breathe 1.7s infinite; }
    .mic-button svg { width: 48px; height: 48px; }
    .mic-label { margin-top: 14px; text-align: center; font-weight: 800; font-size: 16px; }
    .mic-hint { color: var(--muted); text-align: center; font-size: 12px; margin: 6px 0 0; }
    .entry-heading { display: flex; justify-content: space-between; align-items: center; margin: 21px 2px 9px; }
    .entry-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .count { color: var(--blue); font-size: 12px; font-weight: 800; }
    textarea { width: 100%; min-height: 158px; resize: vertical; border: 0; outline: 0; border-radius: 18px; padding: 17px; color: var(--ink); background: #edf2f8; box-shadow: var(--inset); line-height: 1.65; font-size: 16px; }
    textarea::placeholder { color: #9aa6b8; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 16px; }
    .action-btn { min-height: 53px; border-radius: 15px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 12px 10px; color: var(--ink); background: #eef3f9; box-shadow: 5px 6px 12px rgba(49,70,102,.10), -4px -4px 9px #fff; font-size: 13px; font-weight: 800; }
    .action-btn:active { box-shadow: var(--inset); transform: translateY(1px); }
    .action-btn.primary { color: #fff; background: var(--blue); box-shadow: 5px 6px 13px rgba(37,99,235,.28); }
    .action-btn.danger { color: var(--red); }
    .footer-note { display: flex; justify-content: center; gap: 7px; align-items: center; margin: 21px 0 0; color: var(--muted); font-size: 11px; font-weight: 700; }
    .lock { color: var(--green); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 4; display: none; place-items: end center; padding: 18px; background: rgba(20,33,61,.32); backdrop-filter: blur(5px); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(100%, 430px); padding: 22px; border-radius: 24px; background: var(--white); box-shadow: 0 24px 60px rgba(20,33,61,.25); }
    .modal h2 { margin: 0 0 8px; font-size: 21px; } .modal p { margin: 0 0 19px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions button { min-height: 48px; border-radius: 13px; font-weight: 800; } .cancel { background: #eef3f9; color: var(--ink); } .confirm { color: #fff; background: var(--red); }
    @keyframes blink { 50% { opacity: .35; } } @keyframes breathe { 50% { transform: scale(1.025); } }
    @media (min-width: 600px) { .app-shell { padding-top: 36px; } .hero-panel { padding: 30px; } .actions { grid-template-columns: repeat(3, 1fr); } .modal-backdrop { place-items: center; } }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><div class="brand-mark"><span class="brand-dot"></span> Sabaq Labs</div><h1>Voice attendance.</h1></div>
      <button id="installAppBtn" class="install-btn" type="button">Install app</button>
    </header>
    <section class="status-row" aria-live="polite">
      <div id="statusPill" class="status-pill"><span class="status-light"></span><span id="statusText">Ready to listen</span></div>
      <div id="dateLabel" class="date-label"></div>
    </section>
    <section class="hero-panel">
      <div class="mic-wrap">
        <button id="micButton" class="mic-button" type="button" aria-label="Start voice recording" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2.5" width="8" height="13" rx="4"></rect><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5v3M8.5 21.5h7"></path></svg>
        </button>
        <div id="micLabel" class="mic-label">Tap to record</div>
        <p class="mic-hint">Say student numbers one by one</p>
      </div>
      <div class="entry-heading"><h2>Today's attendance</h2><span id="countLabel" class="count">0 entries</span></div>
      <textarea id="attendanceInput" spellcheck="false" aria-label="Attendance entries" placeholder="Your recognized numbers will appear here...\n\nYou can also type or edit them manually."></textarea>
      <div class="actions">
        <button id="exportCsvBtn" class="action-btn primary" type="button"><span aria-hidden="true">↓</span> Export CSV</button>
        <button id="shareBtn" class="action-btn" type="button"><span aria-hidden="true">↗</span> WhatsApp share</button>
        <button id="clearBtn" class="action-btn danger" type="button"><span aria-hidden="true">×</span> Clear data</button>
      </div>
    </section>
    <p class="footer-note"><span class="lock">●</span> Stored privately on this device · works offline</p>
  </main>
  <div id="clearModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal"><h2 id="modalTitle">Clear attendance?</h2><p>This removes today's entries from this device. This action cannot be undone.</p><div class="modal-actions"><button id="cancelClear" class="cancel" type="button">Keep entries</button><button id="confirmClear" class="confirm" type="button">Clear data</button></div></div>
  </div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'sabaq-voice-attendance-v1';
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const input = document.getElementById('attendanceInput');
  const micButton = document.getElementById('micButton');
  const micLabel = document.getElementById('micLabel');
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const countLabel = document.getElementById('countLabel');
  const dateLabel = document.getElementById('dateLabel');
  const state = { recording: false, restarting: false, restartTimer: null, records: [], activeDigits: '', lockedIds: new Set(), sessionFinal: false };
  dateLabel.textContent = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' }).format(new Date());

  function normalize(value) { return value.toLowerCase().replace(/\s+/g, ' ').trim(); }
  function renderView(preview = '') { input.value = [...state.records, preview].filter(Boolean).join('\n'); countLabel.textContent = state.records.length + (state.records.length === 1 ? ' entry' : ' entries'); }
  function updateView() { renderView(); localStorage.setItem(STORAGE_KEY, JSON.stringify(state.records)); }
  function setStatus(mode, text) { statusPill.className = 'status-pill ' + mode; statusText.textContent = text; }
  function digitsOnly(value) { return String(value).replace(/\D/g, ''); }
  function addRecords(values) {
    values.map(digitsOnly).filter(value => value.length === 8).forEach(value => {
      if (state.lockedIds.has(value)) return;
      state.lockedIds.add(value);
      state.records.push(value);
    });
    updateView();
  }
  function numberWordsToDigits(text) {
    const aliases = { zero:'0', oh:'0', one:'1', ek:'1', aik:'1', two:'2', to:'2', too:'2', do:'2', dou:'2', three:'3', teen:'3', four:'4', for:'4', char:'4', chaar:'4', chawwan:'54', pawan:'54', five:'5', six:'6', seven:'7', eight:'8', nine:'9', nau:'9', pachpan:'55', fifty:'5' };
    return text.toLowerCase().replace(/-/g, ' ').match(/\d+|[a-z]+/g)?.map(token => /^\d+$/.test(token) ? token : (aliases[token] ?? '')).join('') || '';
  }
  function extractDigits(text) {
    return numberWordsToDigits(text);
  }
  function renderActiveDigits() {
    if (!state.activeDigits) return;
    renderView(state.activeDigits);
    setStatus('processing', 'Captured ' + state.activeDigits.length + '/8 digits');
  }
  function looksLikeCombination(digits) { return digits.length === 8 && digits.slice(0, 4) === digits.slice(4); }
  function processInterim(rawText) {
    const digits = extractDigits(rawText);
    if (!digits || digits.length > 8) return;
    state.activeDigits = digits;
    renderActiveDigits();
  }
  function processFinal(rawText, confidence = 1) {
    const digits = extractDigits(rawText);
    state.activeDigits = '';
    if (digits.length !== 8 || looksLikeCombination(digits) || confidence < 0.62) {
      renderView();
      setStatus('processing', confidence < 0.62 ? 'Unclear speech, please repeat' : digits.length > 8 ? 'Too many digits, please repeat' : 'Need exactly 8 digits, please repeat');
      return false;
    }
    addRecords([digits]);
    return true;
  }
  function stopRecognition() { if (recognition) { state.restarting = false; clearTimeout(state.restartTimer); recognition.stop(); } }
  function restartRecognition() {
    if (!state.recording || !recognition || state.restarting) return;
    state.restarting = true; clearTimeout(state.restartTimer); state.restartTimer = setTimeout(() => { if (state.recording) { try { recognition.start(); } catch (_) {} } state.restarting = false; }, 180);
  }
  let recognition = null;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition(); recognition.continuous = false; recognition.interimResults = true; recognition.lang = 'en-IN'; recognition.maxAlternatives = 1;
    recognition.onstart = () => { if (!state.recording) { recognition.stop(); return; } state.activeDigits = ''; state.sessionFinal = false; renderView(); setStatus('recording', 'Listening now'); micLabel.textContent = 'Tap to stop'; micButton.classList.add('recording'); micButton.setAttribute('aria-pressed', 'true'); };
    recognition.onresult = event => {
      const result = event.results[event.resultIndex];
      if (!result) return;
      const transcript = result[0].transcript;
      if (result.isFinal) {
        state.sessionFinal = true;
        processFinal(transcript, typeof result[0].confidence === 'number' ? result[0].confidence : 1);
        state.recording = false;
        stopRecognition();
        setStatus('', 'Ready for next ID');
        micLabel.textContent = 'Tap to record next ID';
        micButton.classList.remove('recording');
        micButton.setAttribute('aria-pressed', 'false');
      } else processInterim(transcript);
    };
    recognition.onerror = event => {
      const messages = { 'not-allowed': 'Microphone permission blocked', 'service-not-allowed': 'Speech service unavailable', 'audio-capture': 'No microphone found', network: 'Speech service offline' };
      if (!state.recording || event.error === 'aborted' || event.error === 'no-speech') return;
      state.recording = false; clearTimeout(state.restartTimer); setStatus('processing', messages[event.error] || 'Could not hear you'); micLabel.textContent = 'Tap to try again'; micButton.classList.remove('recording'); micButton.setAttribute('aria-pressed', 'false');
    };
    recognition.onend = () => { if (state.recording && !state.sessionFinal) { setStatus('processing', 'Reconnecting microphone'); restartRecognition(); } else if (!state.recording) { micButton.classList.remove('recording'); micButton.setAttribute('aria-pressed', 'false'); } };
  }
  function toggleRecording() {
    if (!recognition) { setStatus('processing', 'Voice recognition unavailable'); return; }
    if (state.recording) { state.recording = false; stopRecognition(); setStatus('', 'Ready to listen'); micLabel.textContent = 'Tap to record'; micButton.classList.remove('recording'); micButton.setAttribute('aria-pressed', 'false'); }
    else { state.recording = true; state.sessionFinal = false; state.activeDigits = ''; try { recognition.start(); } catch (_) { restartRecognition(); } }
  }
  micButton.addEventListener('click', toggleRecording);
  input.addEventListener('input', () => {
    state.activeDigits = '';
    if (state.recording) { state.recording = false; state.sessionFinal = true; stopRecognition(); setStatus('', 'Ready to listen'); micLabel.textContent = 'Tap to record'; micButton.classList.remove('recording'); micButton.setAttribute('aria-pressed', 'false'); }
    state.records = [...new Set(input.value.split(/\n+/).map(digitsOnly).filter(value => value.length === 8))];
    state.lockedIds = new Set(state.records);
    updateView();
  });
  document.getElementById('exportCsvBtn').addEventListener('click', () => {
    const rows = [['Date', 'Student Number'], ...state.records.map(value => [new Date().toISOString().slice(0, 10), value])];
    const csv = rows.map(row => row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = 'sabaq-attendance-' + new Date().toISOString().slice(0, 10) + '.csv'; link.click(); URL.revokeObjectURL(url);
  });
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const csv = [['Date', 'Student Number'], ...state.records.map(value => [new Date().toISOString().slice(0, 10), value])].map(row => row.join(',')).join('\n');
    const file = new File(['\ufeff' + csv], 'sabaq-attendance-' + new Date().toISOString().slice(0, 10) + '.csv', { type: 'text/csv' });
    if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) { try { await navigator.share({ title: 'Sabaq attendance', text: 'Attendance for ' + dateLabel.textContent, files: [file] }); return; } catch (error) { if (error.name === 'AbortError') return; } }
    const message = 'Attendance - ' + dateLabel.textContent + '\n' + state.records.map((value, index) => (index + 1) + '. ' + value).join('\n');
    window.location.href = 'whatsapp://send?text=' + encodeURIComponent(message);
  });
  const modal = document.getElementById('clearModal');
  document.getElementById('clearBtn').addEventListener('click', () => modal.classList.add('open'));
  document.getElementById('cancelClear').addEventListener('click', () => modal.classList.remove('open'));
  document.getElementById('confirmClear').addEventListener('click', () => { state.records = []; state.lockedIds.clear(); state.activeDigits = ''; state.sessionFinal = false; if (state.recording) { state.recording = false; stopRecognition(); } updateView(); modal.classList.remove('open'); });
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); if (Array.isArray(saved)) state.records = saved.map(digitsOnly).filter(value => value.length === 8); state.records.forEach(value => state.lockedIds.add(value)); updateView();
  let deferredInstallPrompt = null; const installButton = document.getElementById('installAppBtn');
  window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); deferredInstallPrompt = event; installButton.classList.add('visible'); });
  installButton.addEventListener('click', async () => { if (!deferredInstallPrompt) return; deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt = null; installButton.classList.remove('visible'); });
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
